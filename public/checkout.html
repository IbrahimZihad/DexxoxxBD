<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Checkout — DexxoxxBD</title>
<meta name="description" content="Place your order and pay by card, bKash, Nagad, Rocket or bank transfer.">
<link rel="icon" href="assets/img/dexxoxxbd.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="site-header">
  <nav class="shell site-nav" aria-label="Main">
    <a class="brand" href="index.html"><img src="assets/img/dexxoxxbd.jpeg" alt="DexxoxxBD logo">DexxoxxBD</a>
    <div class="nav-links">
      <a href="products.html">Products</a>
      <a href="plans.html">Passes</a>
      <a href="dashboard.html">My passes</a>
      <a href="admin/index.html" id="nav-admin-link" class="hide">Admin</a>
    </div>
    <div class="nav-actions">
      <a class="icon-btn" href="cart.html" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.6.6-.2 1.7.7 1.7H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span id="cart-badge" class="badge-count hide">0</span>
      </a>
      <div id="nav-auth-area" class="cluster"></div>
    </div>
  </nav>
</header>

<main class="page">
  <div class="shell">
    <div class="cluster-between section">
      <div>
        <p class="eyebrow reveal">Step 2 of 2</p>
        <h1 class="reveal">Checkout</h1>
      </div>
      <a class="btn btn-ghost btn-sm reveal" href="cart.html">Back to cart</a>
    </div>

    <div id="payment-banner" class="section"></div>

    <div class="grid-split">
      <section class="stack">
        <div class="panel" id="order-contact">
          <h2 class="panel-head">Who should we contact about this order?</h2>
          <div id="contact-body"></div>
        </div>

        <div class="panel hide" id="pay-panel">
          <h2 class="panel-head">How would you like to pay?</h2>
          <p class="muted" id="pay-amount"></p>
          <div id="pay-methods"></div>
          <div id="pay-detail" class="stack"></div>
        </div>

        <div class="panel hide" id="resume-panel">
          <h2 class="panel-head">You have a pending order</h2>
          <div id="resume-body"></div>
        </div>
      </section>

      <aside class="sticky-top">
        <div class="panel stack" id="checkout-summary"></div>
      </aside>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="shell">
    <p>© <span id="footer-year">2026</span> DexxoxxBD · Digital goods marketplace, Dhaka, Bangladesh.</p>
    <p class="mono">bKash · Nagad · Rocket · SSLCommerz</p>
  </div>
</footer>

<script src="assets/js/core.js"></script>
<script src="assets/js/checkout.js"></script>
</body>
</html>
