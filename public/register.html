<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create account — DexxoxxBD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="assets/css/custom.css">
<script>
  tailwind.config = { theme: { extend: { colors: {
    bg:'#EEF1F6', surface:'#FFFFFF', ink:'#12172B', inksoft:'#4A5068',
    navy:'#1B2340', gold:'#E8A33D', goldink:'#7A4E0E', teal:'#1F9C8B', line:'#C9CEDB', danger:'#D64545'
  } } } };
</script>
</head>
<body class="bg-bg text-ink font-sans min-h-screen flex flex-col">
<div id="toast-wrap" class="fixed top-4 right-4 z-50 flex flex-col gap-2 items-end"></div>

<header class="px-6 py-4">
  <a href="index.html" class="flex items-center gap-2 font-display font-bold text-xl w-fit">
    <img
        src="assets/img/dexxoxxbd.jpeg"
        alt="DexxoxxBD Logo"
        class="w-10 h-10 rounded-full object-cover"
      >
    DexxoxxBD
  </a>
</header>

<main class="flex-1 flex items-center justify-center px-6 py-12">
  <div class="pass-card p-8 w-full max-w-md">
    <h1 class="font-display text-2xl font-bold">Create your account</h1>
    <p class="text-inksoft text-sm mt-1">One account, every digital pass.</p>
    <form id="register-form" class="space-y-4 mt-6">
      <div>
        <label class="text-sm font-medium">Full name</label>
        <input id="name" required class="w-full mt-1 border border-line rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold">
      </div>
      <div>
        <label class="text-sm font-medium">Email</label>
        <input id="email" type="email" required class="w-full mt-1 border border-line rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold">
      </div>
      <div>
        <label class="text-sm font-medium">Phone number</label>
        <input id="phone" placeholder="01XXXXXXXXX" class="w-full mt-1 border border-line rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold">
      </div>
      <div>
        <label class="text-sm font-medium">Password</label>
        <input id="password" type="password" required minlength="6" class="w-full mt-1 border border-line rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold">
        <p class="text-xs text-inksoft mt-1">At least 6 characters.</p>
      </div>
      <button type="submit" class="w-full bg-navy text-white font-semibold py-3 rounded-full hover:bg-ink transition">Create account</button>
    </form>
    <p class="text-sm text-inksoft mt-6 text-center">Already have an account? <a href="login.html" class="text-navy font-semibold hover:underline">Sign in</a></p>
  </div>
</main>

<script src="assets/js/api.js"></script>
<script>
  document.getElementById('register-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = e.target.querySelector('button');
    btn.disabled = true; btn.textContent = 'Creating account…';
    try {
      await Api.register({
        name: document.getElementById('name').value.trim(),
        email: document.getElementById('email').value.trim(),
        phone: document.getElementById('phone').value.trim(),
        password: document.getElementById('password').value,
      });
      location.href = 'dashboard.html';
    } catch (err) {
      alert(err.message);
      btn.disabled = false; btn.textContent = 'Create account';
    }
  });
</script>
</body>
</html>
