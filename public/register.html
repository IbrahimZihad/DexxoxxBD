<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create an account — DexxoxxBD</title>
<meta name="description" content="Create a DexxoxxBD account to buy and track digital subscription passes.">
<link rel="icon" href="assets/img/dexxoxxbd.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="site-header">
  <nav class="shell site-nav" aria-label="Main">
    <a class="brand" href="index.html"><img src="assets/img/dexxoxxbd.jpeg" alt="DexxoxxBD logo">DexxoxxBD</a>
    <div class="nav-links">
      <a href="products.html">Products</a>
      <a href="plans.html">Passes</a>
    </div>
    <div class="nav-actions">
      <a class="btn btn-ghost btn-sm" href="login.html">Sign in</a>
    </div>
  </nav>
</header>

<main>
  <div class="auth-wrap">
    <div class="shell">
      <div class="auth-card card card-pad reveal-scale">
        <p class="eyebrow">New here</p>
        <h1>Create your account</h1>
        <p class="muted">One account holds every pass you buy, with the codes ready to copy.</p>

        <div class="banner banner-danger hide section" id="register-error" role="alert"></div>

        <form class="stack" id="register-form" novalidate autocomplete="on">
          <div class="row-2">
            <label class="field">
              <span class="label">Full name</span>
              <input class="input" type="text" name="name" autocomplete="name" required maxlength="120">
              <span class="error-text" data-for="name"></span>
            </label>
            <label class="field">
              <span class="label">Mobile number</span>
              <input class="input" type="tel" name="phone" autocomplete="tel" inputmode="numeric" placeholder="01712345678" maxlength="14">
              <span class="hint">Optional — used for payment follow-ups.</span>
              <span class="error-text" data-for="phone"></span>
            </label>
          </div>

          <label class="field">
            <span class="label">Email</span>
            <input class="input" type="email" name="email" autocomplete="email" inputmode="email" required>
            <span class="error-text" data-for="email"></span>
          </label>

          <label class="field">
            <span class="label">Password</span>
            <input class="input" type="password" name="password" autocomplete="new-password" required id="register-password">
            <span class="progress" aria-hidden="true"><span class="progress-bar" id="password-meter"></span></span>
            <span class="hint" id="password-hint">At least 8 characters — use a mix of letters, numbers and symbols.</span>
            <span class="error-text" data-for="password"></span>
          </label>

          <label class="field">
            <span class="label">Repeat password</span>
            <input class="input" type="password" name="password_confirm" autocomplete="new-password" required>
            <span class="error-text" data-for="password_confirm"></span>
          </label>

          <label class="switch">
            <input type="checkbox" name="terms" id="terms">
            <span class="track" aria-hidden="true"></span>
            <span>I agree to the resale terms: passes are non-transferable and refunds follow the activation policy.</span>
          </label>

          <button class="btn btn-primary btn-lg btn-block" type="submit">Create account</button>
        </form>

        <p class="auth-alt">Already registered? <a class="link-strong" href="login.html">Sign in instead</a></p>
      </div>
    </div>
  </div>
</main>

<script src="assets/js/core.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
