<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plans — DexxoxxBD Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/css/custom.css">
<script>
  tailwind.config = { theme: { extend: { colors: {
    bg:'#EEF1F6', surface:'#FFFFFF', ink:'#12172B', inksoft:'#4A5068',
    navy:'#1B2340', gold:'#E8A33D', goldink:'#7A4E0E', teal:'#1F9C8B', line:'#C9CEDB', danger:'#D64545'
  } } } };
</script>
</head>
<body class="bg-bg text-ink font-sans">
<div id="toast-wrap" class="fixed top-4 right-4 z-50 flex flex-col gap-2 items-end"></div>

<div class="flex min-h-screen">
  <aside class="w-64 bg-navy text-white shrink-0 hidden md:flex flex-col">
    <div class="p-6 flex items-center gap-2 font-display font-bold text-lg">
      <img
        src="assets/img/dexxoxxbd.jpg"
        alt="DexxoxxBD Logo"
        class="w-10 h-10 rounded-full object-cover"
      >
      DexxoxxBD Admin
    </div>
    <nav class="flex-1 px-4 space-y-1 text-sm font-medium">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition">Dashboard</a>
      <a href="products.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition">Products</a>
      <a href="plans.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-white/10">Passes / Plans</a>
      <a href="orders.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition">Orders</a>
      <a href="users.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition">Users</a>
    </nav>
    <div class="p-4 border-t border-white/10 text-sm">
      <p class="admin-user-name font-semibold"></p>
      <button id="admin-logout-btn" class="text-white/60 hover:text-white text-xs mt-1">Sign out</button>
    </div>
  </aside>

  <main class="flex-1 p-8">
    <div class="flex items-center justify-between mb-8">
      <h1 class="font-display text-2xl font-bold">Passes / Plans</h1>
      <button id="new-plan-btn" class="bg-navy text-white text-sm font-semibold px-5 py-2.5 rounded-full hover:bg-ink transition">+ New plan</button>
    </div>

    <div class="pass-card overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-inksoft border-b border-line">
            <th class="p-4">Plan</th>
            <th class="p-4">Price</th>
            <th class="p-4">Duration</th>
            <th class="p-4">Badge</th>
            <th class="p-4">Status</th>
            <th class="p-4"></th>
          </tr>
        </thead>
        <tbody id="plans-tbody">
          <tr><td class="p-4 text-inksoft" colspan="6">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<div id="plan-modal" class="hidden fixed inset-0 bg-black/40 z-50 flex items-center justify-center p-6">
  <div class="bg-surface rounded-2xl p-6 w-full max-w-lg max-h-[90vh] overflow-y-auto">
    <h2 id="modal-title" class="font-display text-xl font-bold mb-4">New plan</h2>
    <form id="plan-form" class="space-y-4">
      <input type="hidden" id="pl_id">
      <div>
        <label class="text-sm font-medium">Name</label>
        <input id="pl_name" required class="w-full mt-1 border border-line rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold">
      </div>
      <div>
        <label class="text-sm font-medium">Description</label>
        <textarea id="pl_description" rows="2" class="w-full mt-1 border border-line rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-medium">Price (Tk)</label>
          <input id="pl_price" type="number" step="0.01" required class="w-full mt-1 border border-line rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold">
        </div>
        <div>
          <label class="text-sm font-medium">Duration (days)</label>
          <input id="pl_duration_days" type="number" required class="w-full mt-1 border border-line rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold">
        </div>
      </div>
      <div>
        <label class="text-sm font-medium">Features (one per line)</label>
        <textarea id="pl_features" rows="4" class="w-full mt-1 border border-line rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold"></textarea>
      </div>
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="text-sm font-medium">Badge (optional)</label>
          <input id="pl_badge" placeholder="Most Popular" class="w-full mt-1 border border-line rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold">
        </div>
        <div>
          <label class="text-sm font-medium">Status</label>
          <select id="pl_status" class="w-full mt-1 border border-line rounded-lg px-4 py-2.5 focus:outline-none focus:ring-2 focus:ring-gold">
            <option value="active">Active</option>
            <option value="inactive">Inactive</option>
          </select>
        </div>
      </div>
      <div class="flex gap-3 pt-2">
        <button type="button" id="cancel-plan-btn" class="flex-1 border border-line font-semibold py-2.5 rounded-full hover:border-ink transition">Cancel</button>
        <button type="submit" class="flex-1 bg-navy text-white font-semibold py-2.5 rounded-full hover:bg-ink transition">Save plan</button>
      </div>
    </form>
  </div>
</div>

<script src="assets/js/admin-api.js"></script>
<script src="assets/js/plans.js"></script>
</body>
</html>
