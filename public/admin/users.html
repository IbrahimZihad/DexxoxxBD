<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Users — DexxoxxBD Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="../assets/css/custom.css">
<script>
  tailwind.config = { theme: { extend: { colors: {
    bg:'#EEF1F6', surface:'#FFFFFF', ink:'#12172B', inksoft:'#4A5068',
    navy:'#1B2340', gold:'#E8A33D', goldink:'#7A4E0E', teal:'#1F9C8B', line:'#C9CEDB', danger:'#D64545'
  } } } };
</script>
</head>
<body class="bg-bg text-ink font-sans">
<div id="toast-wrap" class="fixed top-4 right-4 z-50 flex flex-col gap-2 items-end"></div>

<div class="flex min-h-screen">
  <aside class="w-64 bg-navy text-white shrink-0 hidden md:flex flex-col">
    <div class="p-6 flex items-center gap-2 font-display font-bold text-lg">
      <img
        src="../assets/img/dexxoxxbd.jpeg"
        alt="DexxoxxBD Logo"
        class="w-10 h-10 rounded-full object-cover"
      >
      DexxoxxBD Admin
    </div>
    <nav class="flex-1 px-4 space-y-1 text-sm font-medium">
      <a href="dashboard.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition">Dashboard</a>
      <a href="products.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition">Products</a>
      <a href="plans.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition">Passes / Plans</a>
      <a href="orders.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition">Orders</a>
      <a href="manual-payments.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg hover:bg-white/10 transition">Manual Payments <span id="nav-pending-badge" class="ml-auto bg-gold text-goldink text-xs font-bold px-1.5 rounded-full hidden"></span></a>
      <a href="users.html" class="flex items-center gap-3 px-3 py-2.5 rounded-lg bg-white/10">Users</a>
    </nav>
    <div class="p-4 border-t border-white/10 text-sm">
      <p class="admin-user-name font-semibold"></p>
      <button id="admin-logout-btn" class="text-white/60 hover:text-white text-xs mt-1">Sign out</button>
    </div>
  </aside>

  <main class="flex-1 p-8">
    <h1 class="font-display text-2xl font-bold mb-8">Users</h1>

    <div class="pass-card overflow-x-auto">
      <table class="w-full text-sm">
        <thead>
          <tr class="text-left text-inksoft border-b border-line">
            <th class="p-4">Name</th>
            <th class="p-4">Email</th>
            <th class="p-4">Role</th>
            <th class="p-4">Status</th>
            <th class="p-4">Joined</th>
            <th class="p-4"></th>
          </tr>
        </thead>
        <tbody id="users-tbody">
          <tr><td class="p-4 text-inksoft" colspan="6">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="assets/js/admin-api.js"></script>
<script src="assets/js/users.js"></script>
</body>
</html>
