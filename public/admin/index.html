<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin sign in — DexxoxxBD</title>
<link rel="icon" href="../assets/img/dexxoxxbd.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/app.css">
<link rel="stylesheet" href="../assets/css/admin.css">
</head>
<body class="admin-login">

  <div class="auth-card card card-pad reveal-scale">
    <a class="brand" href="../index.html"><img src="../assets/img/dexxoxxbd.jpeg" alt="DexxoxxBD logo">DexxoxxBD</a>
    <p class="eyebrow">Staff only</p>
    <h1>Admin sign in</h1>
    <p class="muted">Accounts here are role-checked on every request — a customer cannot reach this panel.</p>

    <div class="banner banner-danger hide section" id="login-error" role="alert"></div>

    <form class="stack" id="login-form" novalidate autocomplete="on">
      <label class="field">
        <span class="label">Email</span>
        <input class="input" type="email" name="email" autocomplete="email" inputmode="email" required>
        <span class="error-text" data-for="email"></span>
      </label>

      <label class="field">
        <span class="label">Password</span>
        <input class="input" type="password" name="password" autocomplete="current-password" required>
        <span class="error-text" data-for="password"></span>
      </label>

      <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in to the panel</button>
    </form>

    <p class="auth-alt">Shopping instead? <a class="link-strong" href="../index.html">Back to the storefront</a></p>
    <p class="hint center">Repeated failures pause this IP for a few minutes.</p>
  </div>

<script src="../assets/js/core.js"></script>
<script src="../assets/js/auth.js"></script>
</body>
</html>
