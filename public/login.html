<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign in — DexxoxxBD</title>
<meta name="description" content="Sign in to see your subscription passes and pass codes.">
<link rel="icon" href="assets/img/dexxoxxbd.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="site-header">
  <nav class="shell site-nav" aria-label="Main">
    <a class="brand" href="index.html"><img src="assets/img/dexxoxxbd.jpeg" alt="DexxoxxBD logo">DexxoxxBD</a>
    <div class="nav-links">
      <a href="products.html">Products</a>
      <a href="plans.html">Passes</a>
    </div>
    <div class="nav-actions">
      <a class="btn btn-ghost btn-sm" href="register.html">Create account</a>
    </div>
  </nav>
</header>

<main>
  <div class="auth-wrap">
    <div class="shell">
      <div class="auth-card card card-pad reveal-scale">
        <p class="eyebrow">Welcome back</p>
        <h1>Sign in</h1>
        <p class="muted">Your pass codes live here — never in an email we cannot recall.</p>

        <div class="banner banner-danger hide section" id="login-error" role="alert"></div>

        <form class="stack" id="login-form" novalidate autocomplete="on">
          <label class="field">
            <span class="label">Email</span>
            <input class="input" type="email" name="email" autocomplete="email" inputmode="email" required>
            <span class="error-text" data-for="email"></span>
          </label>

          <label class="field">
            <span class="label">Password</span>
            <input class="input" type="password" name="password" autocomplete="current-password" required>
            <span class="error-text" data-for="password"></span>
          </label>

          <button class="btn btn-primary btn-lg btn-block" type="submit">Sign in</button>
        </form>

        <p class="auth-alt">No account yet? <a class="link-strong" href="register.html">Create one in 30 seconds</a></p>
        <p class="hint center">Rate limited: repeated failed attempts pause sign-in for a few minutes.</p>
      </div>
    </div>
  </div>
</main>

<script src="assets/js/core.js"></script>
<script src="assets/js/auth.js"></script>
</body>
</html>
