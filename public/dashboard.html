<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My passes — DexxoxxBD</title>
<meta name="description" content="Your active subscription passes, pass codes and order history.">
<link rel="icon" href="assets/img/dexxoxxbd.jpeg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="site-header">
  <nav class="shell site-nav" aria-label="Main">
    <a class="brand" href="index.html"><img src="assets/img/dexxoxxbd.jpeg" alt="DexxoxxBD logo">DexxoxxBD</a>
    <div class="nav-links">
      <a href="products.html">Products</a>
      <a href="plans.html">Passes</a>
      <a href="dashboard.html">My passes</a>
      <a href="admin/index.html" id="nav-admin-link" class="hide">Admin</a>
    </div>
    <div class="nav-actions">
      <a class="icon-btn" href="cart.html" aria-label="Cart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.3 2.3c-.6.6-.2 1.7.7 1.7H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span id="cart-badge" class="badge-count hide">0</span>
      </a>
      <div id="nav-auth-area" class="cluster"></div>
    </div>
  </nav>
</header>

<main class="page">
  <div class="shell">
    <div class="cluster-between section">
      <div>
        <p class="eyebrow reveal">Account</p>
        <h1 class="reveal" id="greeting">My passes</h1>
        <p class="lead reveal" id="dash-sub">Signed in — your pass codes stay on this page, not in your inbox.</p>
      </div>
      <div class="cluster reveal" id="dash-summary"></div>
    </div>

    <div class="tabs" id="dash-tabs" role="tablist">
      <button class="tab is-active" type="button" role="tab" aria-selected="true" data-tab="passes">Passes</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="orders">Orders</button>
      <button class="tab" type="button" role="tab" aria-selected="false" data-tab="profile">Profile</button>
    </div>

    <section class="section" id="tab-passes">
      <div class="grid-cards" id="pass-grid" aria-live="polite"></div>
    </section>

    <section class="section hide" id="tab-orders">
      <div class="panel">
        <div class="table-wrap">
          <table class="table">
            <thead>
              <tr>
                <th scope="col">Order</th>
                <th scope="col">Placed</th>
                <th scope="col" class="num">Total</th>
                <th scope="col">Status</th>
                <th scope="col">Paid by</th>
                <th scope="col">Hold until</th>
                <th scope="col"><span class="sr-only">Actions</span></th>
              </tr>
            </thead>
            <tbody id="orders-body"></tbody>
          </table>
        </div>
        <div class="pagination" id="orders-pagination"></div>
      </div>
    </section>

    <section class="section hide" id="tab-profile">
      <div class="grid-split">
        <div class="panel stack" id="profile-body"></div>
        <div class="panel stack" id="profile-help"></div>
      </div>
    </section>
  </div>
</main>

<div class="modal hide" id="order-modal" role="dialog" aria-modal="true" aria-label="Order details">
  <div class="modal-box modal-box-wide">
    <div class="modal-head">
      <h2 id="order-modal-title">Order</h2>
      <button class="icon-btn" type="button" data-close-modal aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div id="order-modal-body"></div>
  </div>
</div>

<footer class="site-footer">
  <div class="shell">
    <p>© <span id="footer-year">2026</span> DexxoxxBD · Digital goods marketplace, Dhaka, Bangladesh.</p>
    <p class="mono">bKash · Nagad · Rocket · SSLCommerz</p>
  </div>
</footer>

<script src="assets/js/core.js"></script>
<script src="assets/js/dashboard.js"></script>
</body>
</html>
